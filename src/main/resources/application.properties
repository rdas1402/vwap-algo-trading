# Zerodha API Configuration
# Keep live credentials outside git. Use the external config file or env vars:
# ZERODHA_API_KEY, ZERODHA_API_SECRET, ZERODHA_ACCESS_TOKEN.
zerodha.api.key=
zerodha.api.secret=
zerodha.access.token=
zerodha.api.baseurl=https://api.kite.trade

# Trading Strategy Configuration
trading.max.positions=5

# Instruments to Track
trading.instruments=NSE:NIFTY 50

# Trading Schedule
trading.start.time=09:15
trading.end.time=15:15
trading.interval.time=5

# Risk Management
max.daily.loss=35000

# VWAP Strategy Configuration
option.target.price=100.0

# VWAP Options Strategy Configuration
vwap.options.target.price=100.0
vwap.options.price.tolerance=40.0
vwap.options.lot.size=585
vwap.options.max.positions=2
vwap.options.stoploss.multiplier=2.0

# Entry Execution Protection
execution.marketable.limit.buffer.percent=0.5
execution.max.entry.slippage.percent=2.0
execution.min.reward.risk.after.slippage=1.2

# High-probability NIFTY option strategy
highprob.target.premium=100.0
highprob.premium.tolerance=30.0
highprob.opening.range.minutes=15
highprob.min.adx=18.0
highprob.min.atr.percent=0.05
highprob.stop.buffer.percent=0.15
highprob.min.reward.risk=1.5
highprob.no.trade.windows=12:00-13:15,14:30-15:30

# Buying Hours Configuration (for VWAP Strategy)
buying.start.time=09:45
buying.end.time=15:15

# Market Holidays (YYYY-MM-DD format, comma-separated)
market.holidays=2026-01-26,2026-03-03,2026-03-25,2026-04-14,2026-08-15,2026-10-02,2026-11-14,2026-12-25

# Strategy Option Selection Configuration
strategy.target.premium=100
strategy.premium.tolerance=50
strategy.hammer.target.premium=100
strategy.breakout.target.premium=100

