# Test-specific configuration
zerodha.api.key=test_api_key
zerodha.api.secret=test_api_secret
zerodha.access.token=test_access_token
zerodha.api.baseurl=https://testapi.kite.trade

# Faster intervals for testing
trading.interval.time=1
trading.start.time=09:15
trading.end.time=22:25

# Smaller values for testing
trading.max.positions=2
trading.lot.size=50
max.daily.loss=1000

# VWAP Options test configuration
vwap.options.target.price=100.0
vwap.options.price.tolerance=20.0
vwap.options.lot.size=75
vwap.options.max.positions=2

# Real Test Configuration
# WARNING: These tests will place REAL orders

# Test safety controls
test.environment=development
test.max.quantity=25
test.enable.real.orders=false

# Test symbols (replace with actual symbols)
test.ce.symbol=NFO:NIFTY25JAN21500CE
test.pe.symbol=NFO:NIFTY25JAN21500PE

# Test parameters
test.ce.premium=120.50
test.pe.premium=110.75
test.stoploss.multiplier=2.0

# Live Ticker Test Configuration
test.specific.options=NFO:NIFTY25D0226250CE,NFO:NIFTY25D0226250PE
test.base.strike=226250
test.strikes.around=3
test.connection.timeout=60
test.tick.wait.count=10

# WebSocket settings
websocket.max.reconnect.attempts=3
websocket.reconnect.delay=5000

# Order Test Configuration
test.real.orders=false
test.safety.checks=true

# Order Parameters
test.lot.size=50
